services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env first}
      MYSQL_DATABASE: go_course
      MYSQL_USER: learner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u learner go_course -e 'SELECT 1 FROM products LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build: .
    init: true
    environment: &db-env
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: go_course
      DB_USER: learner
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  test:
    profiles: [test]
    build:
      context: .
      target: dev
    environment:
      <<: *db-env
      INTEGRATION_DB: "1"
    command: ["go", "test", "-race", "-count=1", "-v", "./..."]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
